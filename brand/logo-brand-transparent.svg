<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254" role="img" aria-label="Novolis">
  <title>Novolis vector logo</title>
  <defs>
    <linearGradient id="mark-cyan" x1="412" y1="206" x2="850" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fdfff"/>
      <stop offset="1" stop-color="#0997ff"/>
    </linearGradient>
    <linearGradient id="mark-left" x1="314" y1="326" x2="430" y2="639" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12c7ff"/>
      <stop offset="1" stop-color="#237cff"/>
    </linearGradient>
    <linearGradient id="mark-right" x1="871" y1="368" x2="824" y2="674" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#8f37ff"/>
    </linearGradient>
    <linearGradient id="mark-lower" x1="526" y1="714" x2="812" y2="687" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a42ff"/>
      <stop offset="1" stop-color="#b246ff"/>
    </linearGradient>
    <linearGradient id="mark-diagonal" x1="405" y1="327" x2="854" y2="671" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16cfff"/>
      <stop offset="0.52" stop-color="#4d86ff"/>
      <stop offset="1" stop-color="#9c42ff"/>
    </linearGradient>
    <linearGradient id="mark-left-stem" x1="472" y1="433" x2="540" y2="656" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ba8ff"/>
      <stop offset="1" stop-color="#0677d9"/>
    </linearGradient>
    <linearGradient id="mark-right-stem" x1="734" y1="325" x2="804" y2="581" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2aa5ff"/>
      <stop offset="1" stop-color="#6138d9"/>
    </linearGradient>
    <linearGradient id="star-gradient" x1="831" y1="241" x2="918" y2="329" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35d8ff"/>
      <stop offset="1" stop-color="#9b60ff"/>
    </linearGradient>
    <linearGradient id="tagline-gradient" x1="203" y1="967" x2="1051" y2="999" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08bfff"/>
      <stop offset="0.52" stop-color="#7547ff"/>
      <stop offset="1" stop-color="#1a8dff"/>
    </linearGradient>
    <filter id="wordmark-glow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.2" flood-color="#2f8cff" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g id="vector-mark" data-alpha-threshold="16">
    <path id="shape-swirl-upper" data-kind="arc-sector" data-label="swirl_upper" fill="url(#mark-cyan)" d="M413 313 H456 A255 255 0 0 1 810 292 L850 332 A265 265 0 0 0 413 313 Z"/>
    <path id="shape-swirl-left" data-kind="arc-sector" data-label="swirl_left" fill="url(#mark-left)" d="M399 326 A288 288 0 0 0 430 654 L407 654 A318 318 0 0 1 399 326 Z"/>
    <path id="shape-swirl-right" data-kind="arc-sector" data-label="swirl_right" fill="url(#mark-right)" d="M871 368 A302 302 0 0 1 854 640 L824 674 A330 330 0 0 0 871 368 Z"/>
    <path id="shape-swirl-lower" data-kind="arc-sector" data-label="swirl_lower" fill="url(#mark-lower)" d="M466 700 A290 290 0 0 0 812 687 L771 687 A228 228 0 0 1 539 720 Z"/>
    <path id="shape-diagonal" data-kind="straight" data-label="n_diagonal" fill="url(#mark-diagonal)" d="M398 326 H531 L824 619 H854 V640 L837 671 H731 L391 333 Z"/>
    <path id="shape-left-stem" data-kind="straight" data-label="n_left_stem" fill="url(#mark-left-stem)" d="M472 433 L540 496 V616 L504 655 H472 Z"/>
    <path id="shape-right-stem" data-kind="straight" data-label="n_right_stem" fill="url(#mark-right-stem)" d="M734 367 L771 328 H804 V581 L734 513 Z"/>
    <path id="shape-star" data-kind="straight" data-label="star" fill="url(#star-gradient)" d="M874 241 L884 273 L918 285 L884 298 L874 329 L866 300 L831 285 L865 273 Z"/>
  </g>
  <g id="vector-wordmark" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" text-anchor="start">
    <text x="161" y="912" font-size="133" font-weight="700" fill="#f7fbff" textLength="936" lengthAdjust="spacingAndGlyphs" filter="url(#wordmark-glow)">NOVOLIS</text>
    <text x="203" y="999" font-size="35" font-weight="700" fill="url(#tagline-gradient)" textLength="848" lengthAdjust="spacingAndGlyphs">BUILD • CREATE • EXPLORE</text>
  </g>
</svg>
