name: Refresh org landing status

on:
  schedule:
    # Hourly — the docs home also rechecks listed failures in the browser.
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: refresh-org-landing
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout novolis-tools (novolis-docs org-readme)
        uses: actions/checkout@v7
        with:
          repository: Novolis-Platform/novolis-tools
          path: novolis-tools

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Authenticate GitHub Packages
        uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
        with:
          token: ${{ secrets.NOVOLIS_GPR_TOKEN != '' && secrets.NOVOLIS_GPR_TOKEN || github.token }}

      - name: Authenticate GitHub Packages (novolis-tools NuGet.config)
        working-directory: novolis-tools
        shell: bash
        env:
          GPR_TOKEN: ${{ secrets.NOVOLIS_GPR_TOKEN != '' && secrets.NOVOLIS_GPR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          dotnet nuget remove source github --configfile NuGet.config >/dev/null 2>&1 || true
          dotnet nuget add source "https://nuget.pkg.github.com/Novolis-Platform/index.json" \
            --name github \
            --username "x-access-token" \
            --password "$GPR_TOKEN" \
            --store-password-in-clear-text \
            --configfile NuGet.config

      - name: Regenerate status matrix
        env:
          # Prefer org PAT with read:packages across repos when set.
          GH_TOKEN: ${{ secrets.NOVOLIS_GPR_TOKEN != '' && secrets.NOVOLIS_GPR_TOKEN || github.token }}
        run: pwsh -File scripts/Update-OrgLandingStatus.ps1

      - name: Commit status when it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/README.md site/status.json
          if git diff --cached --quiet; then
            echo 'No landing-page changes.'
            exit 0
          fi
          git commit -m "Refresh org landing release status."
          git push origin HEAD:main
