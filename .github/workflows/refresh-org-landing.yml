name: Refresh org landing status

on:
  push:
    branches: [landing-refresh]
  schedule:
    # Daily backup. Merge and release workflows also dispatch landing-status.
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Repository that asked for a refresh
        required: false
        type: string
        default: ''
  repository_dispatch:
    types: [landing-status]

permissions:
  contents: write
  packages: read

concurrency:
  group: refresh-org-landing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Checkout novolis-tools (novolis-docs org-readme)
        uses: actions/checkout@v7
        with:
          repository: Novolis-Platform/novolis-tools
          path: novolis-tools

      - name: Checkout novolis-markup (Markdown HTML renderer)
        uses: actions/checkout@v7
        with:
          repository: Novolis-Platform/novolis-markup
          path: novolis-markup
          sparse-checkout: |
            src/Novolis.Markup.Html
            src/Novolis.Markup.Markdown
            src/Novolis.Markup.Markdown.Rendering
            Directory.Build.props
            Directory.Packages.props
            NuGet.config
            build
          sparse-checkout-cone-mode: true

      - name: Note who asked
        shell: bash
        env:
          DISPATCH_REPO: ${{ github.event.client_payload.repository }}
          DISPATCH_RUN: ${{ github.event.client_payload.html_url }}
          INPUT_SOURCE: ${{ inputs.source }}
        run: echo "Refresh requested by ${DISPATCH_REPO:-${INPUT_SOURCE:-$GITHUB_EVENT_NAME}} ${DISPATCH_RUN:-}"

      - name: Setup .NET
        uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: '10.0.x'

      - name: Authenticate GitHub Packages
        uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
        with:
          token: ${{ secrets.NOVOLIS_GPR_TOKEN != '' && secrets.NOVOLIS_GPR_TOKEN || github.token }}

      - name: Authenticate GitHub Packages (novolis-tools NuGet.config)
        working-directory: novolis-tools
        shell: bash
        env:
          GPR_TOKEN: ${{ secrets.NOVOLIS_GPR_TOKEN != '' && secrets.NOVOLIS_GPR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          dotnet nuget remove source github --configfile NuGet.config >/dev/null 2>&1 || true
          dotnet nuget add source "https://nuget.pkg.github.com/Novolis-Platform/index.json" \
            --name github \
            --username "x-access-token" \
            --password "$GPR_TOKEN" \
            --store-password-in-clear-text \
            --configfile NuGet.config

      - name: Authenticate GitHub Packages (novolis-markup NuGet.config)
        working-directory: novolis-markup
        shell: bash
        env:
          GPR_TOKEN: ${{ secrets.NOVOLIS_GPR_TOKEN != '' && secrets.NOVOLIS_GPR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          dotnet nuget remove source github --configfile NuGet.config >/dev/null 2>&1 || true
          dotnet nuget add source "https://nuget.pkg.github.com/Novolis-Platform/index.json" \
            --name github \
            --username "x-access-token" \
            --password "$GPR_TOKEN" \
            --store-password-in-clear-text \
            --configfile NuGet.config

      - name: Regenerate status matrix
        env:
          # Prefer org PAT with read:packages across repos when set.
          GH_TOKEN: ${{ secrets.NOVOLIS_GPR_TOKEN != '' && secrets.NOVOLIS_GPR_TOKEN || github.token }}
        run: pwsh -File scripts/Update-OrgLandingStatus.ps1

      - name: Commit status when it changed
        env:
          # Write deploy key (NOVOLIS_LANDING_TOKEN) bypasses Protect main. GITHUB_TOKEN cannot.
          PUSH_TOKEN: ${{ secrets.NOVOLIS_LANDING_TOKEN != '' && secrets.NOVOLIS_LANDING_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/README.md site/status.json
          if git diff --cached --quiet; then
            echo 'No landing-page changes.'
            exit 0
          fi
          git commit -m "Refresh org landing release status."
          if printf '%s' "$PUSH_TOKEN" | grep -q 'BEGIN .*PRIVATE KEY'; then
            key="$RUNNER_TEMP/novolis-landing-push"
            printf '%s' "$PUSH_TOKEN" | tr -d '\r' > "$key"
            printf '\n' >> "$key"
            chmod 600 "$key"
            export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git remote set-url origin git@github.com:Novolis-Platform/.github.git
            git push origin HEAD:main
            rm -f "$key"
          else
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/Novolis-Platform/.github.git" HEAD:main
          fi
