name: Publish portfolio docs

on:
  push:
    branches:
      - main
  schedule:
    # Re-ingest docs/ from all org repos even when .github itself is quiet.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout novolis-tools (novolis-docs site)
        uses: actions/checkout@v7
        with:
          repository: Novolis-Platform/novolis-tools
          path: novolis-tools
          sparse-checkout: |
            src/Novolis.Tools.Docs
            src/Novolis.Tools.Docs.Cli
            Directory.Build.props
            Directory.Packages.props
            NuGet.config
            build
          sparse-checkout-cone-mode: true

      # GPR Novolis.Markup.Markdown still ships a stub Parse; build against source until markup merge publishes.
      - name: Checkout novolis-markup (Markdown HTML renderer)
        uses: actions/checkout@v7
        with:
          repository: Novolis-Platform/novolis-markup
          path: novolis-markup
          sparse-checkout: |
            src/Novolis.Markup.Html
            src/Novolis.Markup.Markdown
            src/Novolis.Markup.Markdown.Rendering
            Directory.Build.props
            Directory.Packages.props
            NuGet.config
            build
          sparse-checkout-cone-mode: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Authenticate GitHub Packages
        uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
        with:
          token: ${{ secrets.NOVOLIS_GPR_TOKEN != '' && secrets.NOVOLIS_GPR_TOKEN || github.token }}

      - name: Authenticate GitHub Packages (novolis-tools NuGet.config)
        working-directory: novolis-tools
        shell: bash
        env:
          GPR_TOKEN: ${{ secrets.NOVOLIS_GPR_TOKEN != '' && secrets.NOVOLIS_GPR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          dotnet nuget remove source github --configfile NuGet.config >/dev/null 2>&1 || true
          dotnet nuget add source "https://nuget.pkg.github.com/Novolis-Platform/index.json" \
            --name github \
            --username "x-access-token" \
            --password "$GPR_TOKEN" \
            --store-password-in-clear-text \
            --configfile NuGet.config

      - name: Authenticate GitHub Packages (novolis-markup NuGet.config)
        working-directory: novolis-markup
        shell: bash
        env:
          GPR_TOKEN: ${{ secrets.NOVOLIS_GPR_TOKEN != '' && secrets.NOVOLIS_GPR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          dotnet nuget remove source github --configfile NuGet.config >/dev/null 2>&1 || true
          dotnet nuget add source "https://nuget.pkg.github.com/Novolis-Platform/index.json" \
            --name github \
            --username "x-access-token" \
            --password "$GPR_TOKEN" \
            --store-password-in-clear-text \
            --configfile NuGet.config

      - name: Build portfolio docs
        env:
          GH_TOKEN: ${{ secrets.NOVOLIS_GPR_TOKEN != '' && secrets.NOVOLIS_GPR_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.NOVOLIS_GPR_TOKEN != '' && secrets.NOVOLIS_GPR_TOKEN || github.token }}
        run: pwsh -File scripts/Build-PortfolioPages.ps1 -DocsCli novolis-tools/src/Novolis.Tools.Docs.Cli/Novolis.Tools.Docs.Cli.csproj

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
